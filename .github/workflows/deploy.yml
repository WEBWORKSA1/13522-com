name: Deploy & daily refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC — rotates tip of the day + sitemap lastmod
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh daily content
        if: github.event_name != 'push'
        run: |
          python3 _src/refresh.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "13522-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily.json sitemap.xml
            git commit -m "chore: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
