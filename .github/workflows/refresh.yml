name: Daily auto-refresh

# GitHub Pages serves the main branch directly (Settings → Pages → Deploy from a branch: main / root).
# This job rotates the tip/challenge of the day and sitemap <lastmod>, then commits to main,
# which triggers a fresh Pages build automatically.
on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh daily content
        run: python3 _src/refresh.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "13522-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily.json sitemap.xml
            git commit -m "chore: daily refresh $(date -u +%F)"
            git push
          fi
